server:
  port: 8087

spring:
  application:
    name: file-service
  datasource:
    url: jdbc:postgresql://postgres:5432/file_db
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:blog}
  flyway:
    enabled: true

blog:
  storage:
    internal-endpoint: ${MINIO_INTERNAL_ENDPOINT:http://minio:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_FILE_SERVICE_ACCESS_KEY}
    secret-key: ${MINIO_FILE_SERVICE_SECRET_KEY}
    bucket: blog-files
    region: ${MINIO_REGION:us-east-1}
    allowed-content-types: image/png,image/jpeg,application/pdf
    max-size-bytes: 10485760
    presigned-url-expiry: 10m
  internal:
    file-token: ${INTERNAL_FILE_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
