server:
  port: 8088

spring:
  application:
    name: search-service

blog:
  elasticsearch:
    base-url: http://elasticsearch:9200
  services:
    article-service-url: http://article-service:8084
  internal:
    search-token: ${INTERNAL_SEARCH_TOKEN:local-search-token}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
