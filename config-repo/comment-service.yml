server:
  port: 8089

spring:
  application:
    name: comment-service
  datasource:
    url: jdbc:postgresql://postgres:5432/comment_db
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:blog}
  flyway:
    enabled: true

blog:
  services:
    article-service-url: http://article-service:8084
    notification-service-url: http://notification-service:8091
    audit-service-url: http://audit-service:8092
  internal:
    notification-token: ${INTERNAL_NOTIFICATION_TOKEN:local-notification-token}
    audit-token: ${INTERNAL_AUDIT_TOKEN:local-audit-token}
  outbox:
    notification:
      batch-size: 20
      max-retries: 5
      fixed-delay-ms: 5000
    audit:
      batch-size: 20
      max-retries: 10
      fixed-delay-ms: 5000

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
