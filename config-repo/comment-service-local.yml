server:
  port: 8089

spring:
  application:
    name: comment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: false

blog:
  services:
    article-service-url: http://localhost:8084
    notification-service-url: http://localhost:8091
    audit-service-url: http://localhost:8092
  internal:
    notification-token: ${INTERNAL_NOTIFICATION_TOKEN:local-notification-token}
    audit-token: ${INTERNAL_AUDIT_TOKEN:local-audit-token}

eureka:
  client:
    enabled: false

management:
  metrics:
    tags:
      application: ${spring.application.name:comment-service}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
