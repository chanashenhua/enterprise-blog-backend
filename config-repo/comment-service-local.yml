server:
  port: 8089

spring:
  application:
    name: comment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: false

blog:
  services:
    article-service-url: http://localhost:8084

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
