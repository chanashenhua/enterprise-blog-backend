server:
  port: 8090

spring:
  application:
    name: stats-service
  datasource:
    url: jdbc:postgresql://postgres:5432/stats_db
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:blog}
  flyway:
    enabled: true

blog:
  services:
    article-service-url: http://article-service:8084
  internal:
    feed-token: ${INTERNAL_FEED_TOKEN:local-feed-token}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
