server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    gateway:
      routes:
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/articles/*/comments,/api/articles/*/comments/**
        - id: article-service
          uri: lb://article-service
          predicates:
            - Path=/api/articles/**
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/files/**
        - id: review-admin-service
          uri: lb://review-service
          predicates:
            - Path=/api/admin/reviews/**
        - id: article-admin-search-service
          uri: lb://article-service
          predicates:
            - Path=/api/admin/search/**
        - id: tag-admin-service
          uri: lb://tag-service
          predicates:
            - Path=/api/admin/tags/**,/api/admin/categories/**
        - id: taxonomy-service
          uri: lb://tag-service
          predicates:
            - Path=/api/tags,/api/categories

blog:
  mock-oidc:
    token: ${GATEWAY_DEV_MOCK_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
