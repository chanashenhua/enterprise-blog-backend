server:
  port: 8085

spring:
  application:
    name: tag-service
  datasource:
    url: jdbc:postgresql://postgres:5432/tag_db
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:blog}
  flyway:
    enabled: true
  cache:
    type: redis
  data:
    redis:
      host: redis
      port: 6379

blog:
  cache:
    catalog-ttl: PT5M

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
