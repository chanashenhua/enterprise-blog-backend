server:
  port: 8086

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://postgres:5432/review_db
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:blog}
  flyway:
    enabled: true

blog:
  services:
    permission-service-url: http://permission-service:8083
    article-service-url: http://article-service:8084
    audit-service-url: http://audit-service:8092
  internal:
    review-token: ${INTERNAL_REVIEW_TOKEN:local-review-token}
    audit-token: ${INTERNAL_AUDIT_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
